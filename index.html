<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>License pricing</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo } = React;

    const DAYS_PER_MONTH = 30;
    const DAYS_PER_YEAR = 365;

    const RANGES = {
      seats:      { min: 1,   max: 50,   step: 1 },
      duration:   { min: 30,  max: 1095, step: 1 },
      exponent:   { min: 0.5, max: 1.0,  step: 0.01 },
      loyalty:    { min: 0,   max: 0.5,  step: 0.01 },
      integrator: { min: 0,   max: 1.0,  step: 0.01 },
    };

    const BLEND_WEIGHT = 0.5;

    const REGIONS = [
      { id: "us-ca",       name: "US & Canada",      multiplier: 1.00 },
      { id: "eu",          name: "Europe",           multiplier: 0.97 },
      { id: "apac",        name: "Asia-Pacific",     multiplier: 0.94 },
      { id: "latam",       name: "Latin America",    multiplier: 0.92 },
      { id: "mena-africa", name: "MENA & Africa",    multiplier: 0.90 },
    ];

    const DEFAULT = {
      pluginPrices: [25, 10, 12],
      nPlugins: 3,
      nSeats: 10,
      durationDays: 365,
      alpha: 0.95,
      beta: 0.95,
      gamma: 0.98,
      loyaltyDiscount: 0.15,
      isExisting: false,
      regionId: "us-ca",
      integratorMarkup: 0.20,
    };

    const pluginList = [
      { name: "MECHix Standard", price: 25 },
      { name: "MEP Opening", price: 10 },
      { name: "Brand Integrator", price: 12 },
      { name: "Exporter", price: 12 },
      { name: "Translator", price: 14 },
    ];

    const MODEL_TAGLINE = {
      power:    "Compounding bulk discount across every axis.",
      marginal: "Each additional unit costs slightly less than the last.",
      blend:    "Half linear, half power-law — a safety floor.",
    };

    function Section({ label, hint, children }) {
      return (
        <section className="section">
          <div className="section-label">
            <span>{label}</span>
            {hint && <span className="hint">{hint}</span>}
          </div>
          {children}
        </section>
      );
    }

    function SliderRow({ label, value, min, max, step, onChange, format, hint, meta }) {
      return (
        <div className="slider-row">
          <div className="slider-line">
            <span className="slider-name">{label}</span>
            <span className="slider-right">
              <span className="slider-readout">{format ? format(value) : value}</span>
              {meta && <span className="slider-meta">· {meta}</span>}
            </span>
          </div>
          <input
            type="range"
            min={min}
            max={max}
            step={step}
            value={value}
            onChange={(e) => onChange(parseFloat(e.target.value))}
            className="slider"
          />
          <div className="slider-bounds">
            <span>{format ? format(min) : min}</span>
            <span>{format ? format(max) : max}</span>
          </div>
          {hint && <div className="slider-hint">{hint}</div>}
        </div>
      );
    }

    function FormulaBreakdown({ base, model, loyalty, isExisting }) {
      const fmt = (n) => n.toFixed(4);
      const money = (n) => "$" + n.toFixed(2);

      return (
        <div className="breakdown">
          <div className="breakdown-label">Breakdown</div>
          <div className="breakdown-formula">{model.formula}{isExisting ? " × loyalty" : ""}</div>
          <div className="brows">
            <div className="brow">
              <span className="brow-label">Base bundle (Σ plugin prices /mo)</span>
              <span className="brow-leader" />
              <span className="brow-val">{money(base)}</span>
            </div>
            {model.multipliers.map((m, i) => (
              <div className="brow" key={i}>
                <span className="brow-label">× {m.label}</span>
                <span className="brow-leader" />
                <span className="brow-val">{fmt(m.value)}</span>
              </div>
            ))}
            {isExisting && (
              <div className="brow">
                <span className="brow-label">× Loyalty multiplier</span>
                <span className="brow-leader" />
                <span className="brow-val">{fmt(loyalty)}</span>
              </div>
            )}
            <div className="brow total">
              <span className="brow-label">Total</span>
              <span className="brow-leader" />
              <span className="brow-val">{money(model.total)}</span>
            </div>
          </div>
        </div>
      );
    }

    function ModelCard({ model, linearTotal, isActive, onClick }) {
      const off = linearTotal > 0 ? ((1 - model.total / linearTotal) * 100).toFixed(1) : "0.0";
      const money = (n) => "$" + n.toFixed(2);

      return (
        <article className={`model-card ${isActive ? "active" : ""}`} onClick={onClick}>
          {isActive && <span className="model-active-tag">Selected</span>}
          <div className="model-name">{model.name.split(" (")[0]}</div>
          <div className="model-tagline">{MODEL_TAGLINE[model.key]}</div>
          <div className="model-price">{money(model.total)}</div>
          <div className="model-vs">−{off}% vs. linear</div>
          <p className="model-desc">{model.description}</p>
          <div className="model-callouts">
            <div className="callout good">
              <span className="callout-tag">For</span>
              <span className="callout-text">{model.good}</span>
            </div>
            <div className="callout risk">
              <span className="callout-tag">Catch</span>
              <span className="callout-text">{model.risk}</span>
            </div>
          </div>
          <div className="model-formula">{model.formula}</div>
        </article>
      );
    }

    function App() {
      const [p, setP] = useState(DEFAULT);
      const [modelKey, setModelKey] = useState("power");

      const update = (key) => (val) => setP((prev) => ({ ...prev, [key]: val }));

      const calc = useMemo(() => {
        const region = REGIONS.find(r => r.id === p.regionId) ?? REGIONS[0];
        const baseRaw = p.pluginPrices.slice(0, p.nPlugins).reduce((a, b) => a + b, 0);
        const base = baseRaw * region.multiplier;
        const months = p.durationDays / DAYS_PER_MONTH;
        const loyalty = p.isExisting ? 1 - p.loyaltyDiscount : 1;

        const fPlugins = Math.pow(p.nPlugins, p.alpha - 1);
        const gSeats = Math.pow(p.nSeats, p.beta);
        const hDuration = Math.pow(months, p.gamma);
        const total = base * fPlugins * gSeats * hDuration * loyalty;

        const linearTotal = base * p.nSeats * months;

        const sumPow = (N, exp) => {
          let s = 0;
          for (let i = 1; i <= N; i++) s += Math.pow(i, exp);
          return s;
        };

        const seatsMarg = sumPow(p.nSeats, p.beta - 1);
        const monthsMarg = p.gamma > 0 ? Math.pow(months, p.gamma) / p.gamma : months;
        const pluginsMarg = sumPow(p.nPlugins, p.alpha - 1) / p.nPlugins;
        const totalMarginal = base * pluginsMarg * seatsMarg * monthsMarg * loyalty;

        const W = BLEND_WEIGHT;
        const seatsBlend = W * p.nSeats + (1 - W) * Math.pow(p.nSeats, p.beta);
        const monthsBlend = W * months + (1 - W) * Math.pow(months, p.gamma);
        const pluginsBlend = W + (1 - W) * Math.pow(p.nPlugins, p.alpha - 1);
        const totalBlend = base * pluginsBlend * seatsBlend * monthsBlend * loyalty;

        const models = {
          power: {
            key: "power",
            name: "Power (multiplicative)",
            formula: "Base × N_p^(α−1) × N_s^β × months^γ",
            total,
            multipliers: [
              { label: "f(plugins) = N^(α−1)", value: fPlugins },
              { label: "g(seats) = N^β", value: gSeats },
              { label: "h(months) = months^γ", value: hDuration },
            ],
            description: "Each lever — plugins, seats, and license length — has its own bulk discount, and the discounts multiply together. A customer who grows on every axis at once gets a deeply compounded deal.",
            good: "Rewards customers who buy the full package. Marketing-friendly headline savings.",
            risk: "Aggressive tuning can let a big multi-axis order undercut a smaller single-axis one.",
          },
          marginal: {
            key: "marginal",
            name: "Marginal tiered",
            formula: "Base × avg_p × Σ i^(β−1) × months^γ ⁄ γ",
            total: totalMarginal,
            multipliers: [
              { label: "plugins avg = (Σ i^(α−1))/N", value: pluginsMarg },
              { label: "seats = Σ i^(β−1)", value: seatsMarg },
              { label: "months = months^γ ⁄ γ", value: monthsMarg },
            ],
            description: "Like a punch card. Each next unit costs a bit less than the one before. Total = sum of per-unit prices, not a flat multiplier.",
            good: "A bigger order always costs more than a smaller one. Easy to defend in a sales conversation.",
            risk: "Discounts feel less dramatic at scale. Headline savings shrink.",
          },
          blend: {
            key: "blend",
            name: "Linear-power blend",
            formula: "Base × ½(1 + N_p^(α−1)) × ½(N_s + N_s^β) × ½(M + M^γ)",
            total: totalBlend,
            multipliers: [
              { label: "plugins = ½(1 + N^(α−1))", value: pluginsBlend },
              { label: "seats = ½(N + N^β)", value: seatsBlend },
              { label: "months = ½(M + M^γ)", value: monthsBlend },
            ],
            description: "Splits every price in half. One half scales straight per-unit. The other half gets the full power-law discount. Linear half acts as a safety floor.",
            good: "Most conservative. More units always cost more — zero pricing surprises.",
            risk: "Smaller savings for large customers — discount only applies to half the price.",
          },
        };

        return {
          base, baseRaw, region, months, loyalty, linearTotal,
          fPlugins, gSeats, hDuration, total, totalMarginal, totalBlend,
          integratorMarkup: p.integratorMarkup,
          models,
        };
      }, [p]);

      const activeModel = calc.models[modelKey];
      const savingPct = calc.linearTotal > 0
        ? ((1 - activeModel.total / calc.linearTotal) * 100)
        : 0;
      const customerTotal = activeModel.total * (1 + calc.integratorMarkup);

      return (
        <>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=JetBrains+Mono:wght@400;500;700&display=swap');

            :root {
              --bg:             #FAFAF7;
              --surface:        #FFFFFF;
              --surface-2:      #F4F3EE;
              --ink:            #18181B;
              --ink-2:          #3F3F46;
              --ink-3:          #71717A;
              --ink-4:          #A1A1AA;
              --border:         #E7E5E0;
              --border-strong:  #D4D4CC;
              --soft:           #F0EFEA;
            }

            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

            html, body {
              background: var(--bg);
              color: var(--ink);
              font-family: 'Geist', system-ui, -apple-system, sans-serif;
              font-size: 15px;
              line-height: 1.55;
              -webkit-font-smoothing: antialiased;
              text-rendering: optimizeLegibility;
              font-feature-settings: "ss01", "cv11";
            }

            body { min-height: 100vh; }

            ::selection { background: var(--ink); color: var(--bg); }

            .page {
              max-width: 1080px;
              margin: 0 auto;
              padding: 72px 32px 96px;
            }

            @media (max-width: 720px) {
              .page { padding: 36px 20px 72px; }
            }

            /* ─── Header ─────────────────────────────────── */
            .header {
              margin-bottom: 64px;
              max-width: 640px;
            }

            .header-meta {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              letter-spacing: 0.06em;
              color: var(--ink-3);
              text-transform: uppercase;
              margin-bottom: 16px;
            }

            .header-title {
              font-size: clamp(28px, 4vw, 36px);
              font-weight: 500;
              letter-spacing: -0.025em;
              line-height: 1.15;
              color: var(--ink);
              margin-bottom: 8px;
            }

            .header-sub {
              font-size: 16px;
              font-weight: 400;
              color: var(--ink-3);
              line-height: 1.55;
            }

            /* ─── Layout grid ─────────────────────────────────── */
            .grid {
              display: grid;
              grid-template-columns: minmax(0, 6fr) minmax(0, 5fr);
              gap: 64px;
              align-items: start;
            }

            @media (max-width: 900px) {
              .grid { grid-template-columns: 1fr; gap: 32px; }
            }

            .col-config { min-width: 0; }
            .col-result { min-width: 0; }

            /* ─── Section ─────────────────────────────────── */
            .section {
              margin-bottom: 36px;
            }
            .section:last-child { margin-bottom: 0; }

            .section-label {
              display: flex;
              justify-content: space-between;
              align-items: baseline;
              font-size: 13px;
              font-weight: 500;
              color: var(--ink-2);
              margin-bottom: 16px;
              letter-spacing: 0;
            }

            .section-label .hint {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              color: var(--ink-4);
              font-weight: 400;
            }

            /* ─── Region ─────────────────────────────────── */
            .region-list {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(124px, 1fr));
              gap: 6px;
            }

            .region-option {
              background: var(--surface);
              border: 1px solid var(--border);
              border-radius: 8px;
              padding: 10px 12px;
              cursor: pointer;
              text-align: left;
              display: flex;
              flex-direction: column;
              gap: 3px;
              font-family: inherit;
              transition: border-color 0.15s, background 0.15s;
              color: var(--ink);
            }

            .region-option:hover { border-color: var(--ink-4); }

            .region-option.active {
              background: var(--ink);
              border-color: var(--ink);
              color: var(--bg);
            }

            .region-option-name {
              font-size: 13px;
              font-weight: 500;
            }

            .region-option-rate {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              color: var(--ink-3);
            }

            .region-option.active .region-option-rate { color: var(--ink-4); }

            /* ─── Plugins ─────────────────────────────────── */
            .plugin-list {
              display: flex;
              flex-direction: column;
              gap: 6px;
            }

            .plugin-chip {
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 11px 14px;
              background: var(--surface);
              border: 1px solid var(--border);
              border-radius: 8px;
              cursor: pointer;
              user-select: none;
              transition: border-color 0.15s, background 0.15s;
              color: var(--ink);
            }

            .plugin-chip:hover { border-color: var(--ink-4); }

            .plugin-chip.active {
              background: var(--ink);
              border-color: var(--ink);
              color: var(--bg);
            }

            .plugin-chip-name {
              font-size: 14px;
              font-weight: 500;
            }

            .plugin-chip-price {
              font-family: 'JetBrains Mono', monospace;
              font-size: 12px;
              color: var(--ink-3);
            }

            .plugin-chip.active .plugin-chip-price { color: var(--ink-4); }

            /* ─── Slider ─────────────────────────────────── */
            .slider-row {
              margin-bottom: 22px;
            }
            .slider-row:last-child { margin-bottom: 4px; }

            .slider-line {
              display: flex;
              justify-content: space-between;
              align-items: baseline;
              gap: 12px;
              margin-bottom: 8px;
            }

            .slider-name {
              font-size: 14px;
              font-weight: 500;
              color: var(--ink);
            }

            .slider-right { display: inline-flex; gap: 4px; align-items: baseline; }

            .slider-readout {
              font-family: 'JetBrains Mono', monospace;
              font-size: 13px;
              color: var(--ink);
              font-weight: 500;
              font-variant-numeric: tabular-nums lining-nums;
            }

            .slider-meta {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              color: var(--ink-3);
            }

            .slider {
              width: 100%;
              -webkit-appearance: none;
              appearance: none;
              height: 2px;
              background: var(--border-strong);
              outline: none;
              cursor: pointer;
              border-radius: 1px;
            }

            .slider::-webkit-slider-thumb {
              -webkit-appearance: none;
              appearance: none;
              width: 14px;
              height: 14px;
              background: var(--ink);
              border: none;
              border-radius: 50%;
              cursor: grab;
              transition: transform 0.15s;
            }

            .slider:hover::-webkit-slider-thumb { transform: scale(1.15); }
            .slider:active::-webkit-slider-thumb { cursor: grabbing; transform: scale(1.15); }

            .slider::-moz-range-thumb {
              width: 14px;
              height: 14px;
              background: var(--ink);
              border: none;
              border-radius: 50%;
              cursor: grab;
            }

            .slider-bounds {
              display: flex;
              justify-content: space-between;
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              color: var(--ink-4);
              margin-top: 6px;
            }

            .slider-hint {
              font-size: 12.5px;
              color: var(--ink-3);
              margin-top: 6px;
              line-height: 1.45;
            }

            /* ─── Adjustments groups ─────────────────────────────────── */
            .adj-group {
              margin-bottom: 24px;
            }
            .adj-group:last-child { margin-bottom: 0; }

            .adj-group-label {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              text-transform: uppercase;
              letter-spacing: 0.08em;
              color: var(--ink-3);
              margin-bottom: 12px;
            }

            .toggle-row {
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 12px 0 0;
              margin-top: 4px;
            }

            .toggle-label {
              font-size: 14px;
              font-weight: 500;
              color: var(--ink);
            }

            .toggle {
              width: 36px;
              height: 20px;
              background: var(--border-strong);
              border-radius: 10px;
              position: relative;
              cursor: pointer;
              transition: background 0.2s;
              flex: 0 0 auto;
            }

            .toggle.on { background: var(--ink); }

            .toggle-knob {
              position: absolute;
              top: 2px;
              left: 2px;
              width: 16px;
              height: 16px;
              background: var(--bg);
              border-radius: 50%;
              transition: transform 0.2s;
              box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            }

            .toggle.on .toggle-knob { transform: translateX(16px); }

            /* ─── Result card ─────────────────────────────────── */
            .result {
              position: sticky;
              top: 24px;
              background: var(--surface);
              border: 1px solid var(--border);
              border-radius: 14px;
              padding: 28px 28px 24px;
            }

            @media (max-width: 900px) {
              .result { position: static; }
            }

            .result-tabs {
              display: flex;
              gap: 2px;
              background: var(--soft);
              border-radius: 8px;
              padding: 3px;
              margin-bottom: 28px;
            }

            .result-tab {
              flex: 1;
              background: transparent;
              border: none;
              padding: 7px 8px;
              font-family: inherit;
              font-size: 12px;
              font-weight: 500;
              color: var(--ink-3);
              border-radius: 6px;
              cursor: pointer;
              transition: all 0.15s;
              text-transform: capitalize;
            }

            .result-tab:hover { color: var(--ink); }

            .result-tab.active {
              background: var(--surface);
              color: var(--ink);
              box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0,0,0,0.03);
            }

            .result-label {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              color: var(--ink-3);
              text-transform: uppercase;
              letter-spacing: 0.08em;
              margin-bottom: 6px;
            }

            .result-total {
              font-size: clamp(40px, 6vw, 56px);
              font-weight: 500;
              letter-spacing: -0.035em;
              color: var(--ink);
              font-variant-numeric: tabular-nums lining-nums;
              line-height: 1;
            }

            .result-total .currency {
              color: var(--ink-3);
              font-weight: 400;
              margin-right: 2px;
            }

            .result-context {
              font-size: 13.5px;
              color: var(--ink-3);
              margin-top: 10px;
              padding-bottom: 18px;
              border-bottom: 1px solid var(--border);
              line-height: 1.5;
            }

            .result-context .name {
              color: var(--ink);
              font-weight: 500;
            }

            .result-row {
              display: flex;
              justify-content: space-between;
              align-items: baseline;
              padding: 11px 0;
              font-size: 14px;
              border-bottom: 1px solid var(--border);
              gap: 12px;
            }
            .result-row:last-of-type { border-bottom: none; }

            .result-row-label {
              color: var(--ink-3);
              line-height: 1.4;
            }
            .result-row-label .small {
              display: block;
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              color: var(--ink-4);
              margin-top: 2px;
            }

            .result-row-val {
              font-family: 'JetBrains Mono', monospace;
              color: var(--ink);
              font-weight: 500;
              font-variant-numeric: tabular-nums lining-nums;
              flex: 0 0 auto;
            }

            .result-row.customer .result-row-val {
              font-family: 'Geist', sans-serif;
              font-size: 18px;
              font-weight: 600;
              letter-spacing: -0.02em;
            }

            /* ─── Breakdown ─────────────────────────────────── */
            .breakdown {
              margin-top: 24px;
              padding-top: 20px;
              border-top: 1px solid var(--border);
            }

            .breakdown-label {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              text-transform: uppercase;
              letter-spacing: 0.08em;
              color: var(--ink-3);
              margin-bottom: 8px;
            }

            .breakdown-formula {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11.5px;
              color: var(--ink-2);
              line-height: 1.55;
              padding-bottom: 14px;
              margin-bottom: 8px;
              border-bottom: 1px solid var(--border);
              word-break: break-word;
            }

            .brows {
              display: flex;
              flex-direction: column;
            }

            .brow {
              display: flex;
              align-items: baseline;
              padding: 7px 0;
              gap: 6px;
              font-size: 13px;
            }

            .brow-label {
              color: var(--ink-2);
              flex: 0 0 auto;
              max-width: 65%;
            }

            .brow-leader {
              flex: 1 1 12px;
              border-bottom: 1px dotted var(--border-strong);
              height: 1px;
              transform: translateY(-3px);
              min-width: 12px;
            }

            .brow-val {
              font-family: 'JetBrains Mono', monospace;
              font-size: 12px;
              color: var(--ink);
              font-weight: 500;
              font-variant-numeric: tabular-nums lining-nums;
              flex: 0 0 auto;
            }

            .brow.total {
              border-top: 1px solid var(--border);
              padding: 12px 0 0;
              margin-top: 6px;
            }

            .brow.total .brow-label {
              color: var(--ink);
              font-weight: 600;
              font-family: 'Geist', sans-serif;
              font-size: 14px;
            }

            .brow.total .brow-val {
              color: var(--ink);
              font-weight: 600;
              font-size: 14px;
            }

            /* ─── Models comparison ─────────────────────────────────── */
            .models {
              margin-top: 80px;
              padding-top: 40px;
              border-top: 1px solid var(--border);
            }

            .models-header {
              margin-bottom: 24px;
              display: flex;
              justify-content: space-between;
              align-items: baseline;
              flex-wrap: wrap;
              gap: 12px;
            }

            .models-title {
              font-size: 22px;
              font-weight: 500;
              letter-spacing: -0.02em;
              color: var(--ink);
            }

            .models-sub {
              font-size: 13px;
              color: var(--ink-3);
            }

            .models-grid {
              display: grid;
              grid-template-columns: 1fr 1fr 1fr;
              gap: 12px;
            }

            @media (max-width: 900px) {
              .models-grid { grid-template-columns: 1fr; }
            }

            .model-card {
              background: var(--surface);
              border: 1px solid var(--border);
              border-radius: 14px;
              padding: 24px;
              cursor: pointer;
              transition: border-color 0.15s;
              display: flex;
              flex-direction: column;
            }

            .model-card:hover { border-color: var(--ink-4); }

            .model-card.active {
              border-color: var(--ink);
            }

            .model-active-tag {
              display: inline-block;
              align-self: flex-start;
              font-family: 'JetBrains Mono', monospace;
              font-size: 10px;
              color: var(--bg);
              font-weight: 500;
              background: var(--ink);
              padding: 3px 8px;
              border-radius: 4px;
              margin-bottom: 12px;
              letter-spacing: 0.06em;
              text-transform: uppercase;
            }

            .model-name {
              font-size: 18px;
              font-weight: 500;
              letter-spacing: -0.015em;
              margin-bottom: 4px;
            }

            .model-tagline {
              font-size: 13px;
              color: var(--ink-3);
              margin-bottom: 20px;
              line-height: 1.5;
            }

            .model-price {
              font-size: 28px;
              font-weight: 500;
              letter-spacing: -0.025em;
              font-variant-numeric: tabular-nums lining-nums;
              margin-bottom: 4px;
              line-height: 1;
            }

            .model-vs {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              color: var(--ink-3);
              margin-bottom: 20px;
            }

            .model-desc {
              font-size: 13.5px;
              color: var(--ink-2);
              line-height: 1.6;
              margin-bottom: 18px;
            }

            .model-callouts {
              display: flex;
              flex-direction: column;
              gap: 12px;
              margin-bottom: 18px;
            }

            .callout {
              display: flex;
              gap: 10px;
              font-size: 13px;
              line-height: 1.55;
            }

            .callout-tag {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              color: var(--ink-3);
              flex: 0 0 44px;
              text-transform: uppercase;
              letter-spacing: 0.04em;
              padding-top: 1px;
            }

            .callout-text {
              color: var(--ink-2);
              flex: 1;
            }

            .model-formula {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              color: var(--ink-3);
              margin-top: auto;
              padding-top: 16px;
              border-top: 1px solid var(--border);
              word-break: break-word;
              line-height: 1.5;
            }

            /* ─── Baseline strip ─────────────────────────────────── */
            .baseline {
              margin-top: 12px;
              background: var(--surface-2);
              border: 1px solid var(--border);
              border-radius: 14px;
              padding: 16px 24px;
              display: grid;
              grid-template-columns: auto 1fr auto auto;
              gap: 18px;
              align-items: baseline;
            }

            @media (max-width: 720px) {
              .baseline { grid-template-columns: 1fr; gap: 6px; padding: 16px; }
            }

            .baseline-tag {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              color: var(--ink-3);
              font-weight: 500;
              text-transform: uppercase;
              letter-spacing: 0.06em;
            }

            .baseline-name {
              font-size: 14px;
              color: var(--ink-2);
              font-weight: 500;
            }

            .baseline-formula {
              font-family: 'JetBrains Mono', monospace;
              font-size: 11px;
              color: var(--ink-3);
            }

            .baseline-total {
              font-family: 'JetBrains Mono', monospace;
              font-size: 14px;
              font-weight: 500;
              color: var(--ink);
              font-variant-numeric: tabular-nums lining-nums;
            }

            /* ─── Footer ─────────────────────────────────── */
            .footer {
              margin-top: 64px;
              padding-top: 24px;
              border-top: 1px solid var(--border);
              font-size: 12px;
              color: var(--ink-4);
              text-align: center;
            }
          `}</style>

          <main className="page">

            <header className="header">
              <div className="header-meta">License pricing · sandbox</div>
              <h1 className="header-title">Tune the formula, watch the total move.</h1>
              <p className="header-sub">Pick plugins, set seats, term, and discount exponents — three pricing models recompute live.</p>
            </header>

            <div className="grid">

              {/* ─── Configuration ─────────────────────────────────── */}
              <div className="col-config">

                <Section label="Region">
                  <div className="region-list">
                    {REGIONS.map((r) => (
                      <button
                        key={r.id}
                        type="button"
                        className={`region-option ${p.regionId === r.id ? "active" : ""}`}
                        onClick={() => setP(prev => ({ ...prev, regionId: r.id }))}
                      >
                        <span className="region-option-name">{r.name}</span>
                        <span className="region-option-rate">×{r.multiplier.toFixed(2)}</span>
                      </button>
                    ))}
                  </div>
                </Section>

                <Section label="Plugins" hint={`${p.nPlugins} selected`}>
                  <div className="plugin-list">
                    {pluginList.map((pl, i) => {
                      const selected = p.selectedPlugins
                        ? p.selectedPlugins.includes(i)
                        : i < p.nPlugins;
                      return (
                        <div
                          key={i}
                          className={`plugin-chip ${selected ? "active" : ""}`}
                          onClick={() => {
                            const current = p.selectedPlugins ?? pluginList.map((_, j) => j < p.nPlugins ? j : -1).filter(j => j >= 0);
                            const next = current.includes(i)
                              ? current.filter(x => x !== i)
                              : [...current, i];
                            const prices = next.map(idx => pluginList[idx].price);
                            setP(prev => ({
                              ...prev,
                              selectedPlugins: next,
                              nPlugins: next.length || 1,
                              pluginPrices: prices.length ? prices : [0],
                            }));
                          }}
                        >
                          <span className="plugin-chip-name">{pl.name}</span>
                          <span className="plugin-chip-price">${pl.price}/mo</span>
                        </div>
                      );
                    })}
                  </div>
                </Section>

                <Section label="Seats and duration">
                  <SliderRow
                    label="Seats"
                    value={p.nSeats}
                    {...RANGES.seats}
                    onChange={update("nSeats")}
                  />
                  <SliderRow
                    label="License duration"
                    value={p.durationDays}
                    {...RANGES.duration}
                    onChange={update("durationDays")}
                    format={(v) => v >= DAYS_PER_YEAR ? `${(v / DAYS_PER_YEAR).toFixed(1)} yr` : `${v} d`}
                  />
                </Section>

                <Section label="Scaling exponents" hint="1.0 = linear; lower = steeper discount">
                  <SliderRow
                    label="α  Plugins"
                    value={p.alpha}
                    {...RANGES.exponent}
                    onChange={update("alpha")}
                    format={(v) => v.toFixed(2)}
                    meta={`${((1 - p.alpha) * 100).toFixed(0)}% off`}
                  />
                  <SliderRow
                    label="β  Seats"
                    value={p.beta}
                    {...RANGES.exponent}
                    onChange={update("beta")}
                    format={(v) => v.toFixed(2)}
                    meta={`${((1 - p.beta) * 100).toFixed(0)}% off`}
                  />
                  <SliderRow
                    label="γ  Duration"
                    value={p.gamma}
                    {...RANGES.exponent}
                    onChange={update("gamma")}
                    format={(v) => v.toFixed(2)}
                    meta={`${((1 - p.gamma) * 100).toFixed(0)}% off`}
                  />
                </Section>

                <Section label="Adjustments">

                  <div className="adj-group">
                    <div className="adj-group-label">Loyalty</div>
                    <SliderRow
                      label="Discount rate"
                      value={p.loyaltyDiscount}
                      {...RANGES.loyalty}
                      onChange={update("loyaltyDiscount")}
                      format={(v) => `${(v * 100).toFixed(0)}%`}
                      hint="Applied only if customer already holds a license"
                    />
                    <div className="toggle-row">
                      <span className="toggle-label">Existing license holder</span>
                      <div
                        className={`toggle ${p.isExisting ? "on" : ""}`}
                        onClick={() => setP(prev => ({ ...prev, isExisting: !prev.isExisting }))}
                      >
                        <div className="toggle-knob" />
                      </div>
                    </div>
                  </div>

                  <div className="adj-group">
                    <div className="adj-group-label">Integrator</div>
                    <SliderRow
                      label="Reseller markup"
                      value={p.integratorMarkup}
                      {...RANGES.integrator}
                      onChange={update("integratorMarkup")}
                      format={(v) => `+${(v * 100).toFixed(0)}%`}
                      hint="Surcharge above publisher price"
                    />
                  </div>

                </Section>
              </div>

              {/* ─── Result ─────────────────────────────────── */}
              <aside className="col-result">
                <div className="result">

                  <div className="result-tabs">
                    {Object.values(calc.models).map((m) => (
                      <button
                        key={m.key}
                        className={`result-tab ${modelKey === m.key ? "active" : ""}`}
                        onClick={() => setModelKey(m.key)}
                      >
                        {m.key}
                      </button>
                    ))}
                  </div>

                  <div className="result-label">Publisher total</div>
                  <div className="result-total">
                    <span className="currency">$</span>{activeModel.total.toFixed(2)}
                  </div>
                  <div className="result-context">
                    <span className="name">{activeModel.name}</span> · {calc.region.name} · {calc.months.toFixed(1)} mo · {p.nSeats} seats
                  </div>

                  <div className="result-row customer">
                    <div className="result-row-label">
                      Customer pays
                      <span className="small">+{(calc.integratorMarkup * 100).toFixed(0)}% integrator</span>
                    </div>
                    <div className="result-row-val">${customerTotal.toFixed(2)}</div>
                  </div>

                  <div className="result-row">
                    <div className="result-row-label">Saving vs. linear</div>
                    <div className="result-row-val">{savingPct.toFixed(1)}%</div>
                  </div>

                  <div className="result-row">
                    <div className="result-row-label">Linear baseline</div>
                    <div className="result-row-val">${calc.linearTotal.toFixed(2)}</div>
                  </div>

                  <FormulaBreakdown
                    base={calc.base}
                    model={activeModel}
                    loyalty={calc.loyalty}
                    isExisting={p.isExisting}
                  />
                </div>
              </aside>
            </div>

            {/* ─── Pricing models ─────────────────────────────────── */}
            <section className="models">
              <div className="models-header">
                <h2 className="models-title">Pricing models</h2>
                <span className="models-sub">Click to apply</span>
              </div>

              <div className="models-grid">
                {Object.values(calc.models).map((m) => (
                  <ModelCard
                    key={m.key}
                    model={m}
                    linearTotal={calc.linearTotal}
                    isActive={modelKey === m.key}
                    onClick={() => setModelKey(m.key)}
                  />
                ))}
              </div>

              <div className="baseline">
                <span className="baseline-tag">Baseline</span>
                <span className="baseline-name">Linear (no discount)</span>
                <span className="baseline-formula">base × seats × months</span>
                <span className="baseline-total">${calc.linearTotal.toFixed(2)}</span>
              </div>
            </section>

          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
